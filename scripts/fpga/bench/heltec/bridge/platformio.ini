; Heltec WiFi LoRa 32 V3 as a wire bridge between croc (ZedBoard Pmod JB) and its SX1262.
; Build and flash: pio run -d heltec/bridge -t upload --upload-port /dev/cu.usbserial-...
[env:bridge]
platform = espressif32@7.1.2
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
lib_deps = olikraus/U8g2@2.35.30
