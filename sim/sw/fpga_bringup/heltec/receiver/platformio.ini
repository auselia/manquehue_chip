; Heltec WiFi LoRa 32 V3 as the LoRa receiver for croc's packets (steps 4 and 8). Prints each packet on USB serial.
; Build and flash: pio run -d heltec/receiver -t upload --upload-port /dev/cu.usbserial-...
[env:receiver]
platform = espressif32@7.1.2
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
lib_deps = jgromes/RadioLib@7.1.2
