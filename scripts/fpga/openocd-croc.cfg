# OpenOCD configuration of croc over a J-Link: the JTAG TAP and the RISC-V target
# Author: Nicolás Villegas - Universidad de los Andes, Chile
# usage: openocd -f scripts/fpga/openocd-croc.cfg (bench/load.sh)
adapter driver jlink
transport select jtag
adapter speed 4000

set _CHIPNAME croc

# croc_pkg::PulpJtagIdCode, version 1
set _CPUTAPID 0x1c0c5db3

# instruction register length of the debug module TAP
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id $_CPUTAPID

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME

# The bootrom waits in wfi after reset for a software interrupt (rtl/bootrom/bootrom.sv). Set the CLINT msip
# register (0x0204_0000) after every reset, so the interrupt is pending when you load and continue.
$_TARGETNAME configure -event reset-deassert-post {
    mww 0x02040000 1
}

init
reset halt
