# openocd-croc.cfg
adapter driver jlink
transport select jtag
adapter speed 4000

set _CHIPNAME croc

# croc_pkg::PulpJtagIdCode with version=4'h1 ("2nd version (2026)")
set _CPUTAPID 0x1c0c5db3

# RISC-V debug module TAP instruction register length
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id $_CPUTAPID

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME

# bootrom parks the core in `wfi` after reset, waiting for a machine
# software interrupt to wake it (see rtl/bootrom/bootrom.sv). Write CLINT's
# msip register (offset 0, base 0x0204_0000) right after every reset so
# it's already pending by the time you `load` + `continue` -- no more
# manually poking it from gdb every session.
$_TARGETNAME configure -event reset-deassert-post {
    mww 0x02040000 1
}

init
reset halt